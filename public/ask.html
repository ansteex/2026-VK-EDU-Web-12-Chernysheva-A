<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый вопрос Aski Haski</title>
    <link rel="icon" type="image/png" href="static/img/avatar6.png">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
     <header class="class-header">
        <div class="logo">
             <a href="index.html">Aski Haski</a>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Поиск">
        </div>
        <div class="header-actions">
            <a href="ask.html">Задать вопрос</a>
            <a href="login.html">Войти</a>
            <a href="signup.html">Регистрация</a>
        </div>
    </header>
    <main>
        <section class="ask-page">
            <h2>Новый вопрос</h2>
             <form>
                <label for="question-title" class="form-label">Заголовок вопроса:</label>
                <input type="text"
                    class="form-control"
                    id="question-title"
                    name="question-title"
                    maxlength="150"
                    placeholder="Кратко сформулируйте вопрос"
                    required>
                <div class="form-text">
                    Максимум 150 символов.
                </div>

                <label for="question-text" class="form-label">Текст вопроса:</label>
                <textarea id="question-text" name="question-text" rows="5" class="form-control" required></textarea>

                <label for="question-tags" class="form-label">Теги (через запятую):</label>
                <input
                    type="text"
                    id="question-tags"
                    name="question-tags"
                    class="form-control is-invalid"
                >
                <div class="invalid-feedback">
                    Можно указать не более трёх тегов.
                </div>
                <div class="form-text">
                    Укажите не более трёх тегов через запятую.
                </div>
                <button type="submit" class="btn save-button">Отправить вопрос</button>
            </form>
        </section>
        <aside class="sidebar">
            <section class="sidebar-block">
                <h2>Популярные теги</h2>
                <div class="tag-list">
                    <a href="#">Python</a>
                    <a href="#">HTML</a>
                    <a href="#">CSS</a>
                    <a href="#">C++</a>
                    <a href="#">Django</a>
                </div>
            </section>
            <section class="sidebar-block">
                <h2>Лучшие участники</h2>
                <ul class="best-members">
                    <li><a href="#">Кто-то1</a></li>
                    <li><a href="#">Кто-то2</a></li>
                    <li><a href="#">Кто-то3</a></li>
                </ul>
            </section>
        </aside>
    </main>
    <footer class="footer">
        <p>Aski Haski</p>
    </footer>

    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
