<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация Aski Haski</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
     <header class="class-header">
        <div class="logo">
             <a href="index.html">Aski Haski</a>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Поиск">
        </div>
        <div class="header-actions">
            <a href="ask.html">Задать вопрос</a>
            <a href="login.html">Войти</a>
            <a href="signup.html">Регистрация</a>
        </div>
    </header>
    <main>
        <section class="login-page">
            <h2>Вход в систему</h2>
            <div class="alert alert-danger" role="alert">
                Неправильное имя пользователя или пароль.
            </div>
            <form>
                <label for="username" class="form-label">Имя пользователя:</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    required
                >

                <label for="password" class="form-label">Пароль:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required
                >

                <button type="submit" class="btn save-button">Войти</button>
                <a href="signup.html">Ещё нет аккаунта? Зарегистрироваться</a>
            </form>
        </section>
        <aside class="sidebar">
            <h2>Популярные теги</h2>
            <p>Python, HTML, CSS, C++</p>

            <h2>Лучшие участники</h2>
            <p>Кто-то</p>
        </aside>
    </main>
    <footer class="footer">
        <p>Aski Haski</p>
    </footer>
    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
