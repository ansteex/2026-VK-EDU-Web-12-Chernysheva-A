<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aski Haski</title>

    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="class-header">
        <div class="logo">
             <a href="index.html">Aski Haski</a>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Поиск">
        </div>
        <div class="header-actions">
            <a href="ask.html">Задать вопрос</a>
            <a href="login.html">Войти</a>
            <a href="signup.html">Регистрация</a>
        </div>
    </header>
    <main>
        <section class="signup-page">
            <h1>Регистрация</h1>
            <div class="alert alert-danger" role="alert">
                Не удалось зарегистрироваться. Проверьте введённые данные.
            </div>
            <form>
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control is-invalid"
                    required
                >
                <div class="invalid-feedback">
                    Введите корректный email.
                </div>
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" id="username" name="username" class="form-control" required>
                <label for="avatar" class="form-label">Аватарка</label>
                <input type="file" id="avatar" name="avatar" class="form-control" accept="image/*">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-control" required>
                <label for="confirm_password" class="form-label">Подтвердите пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                <a href="login.html">Уже есть аккаунт? Войти</a>
            </form>
        </section>
        <aside class="sidebar">
                <h2>Популярные теги</h2>
                <p>Python, HTML, CSS, C++</p>

                <h2>Лучшие участники</h2>
                <p>Кто-то</p>
        </aside>
    </main>
    <footer class="footer">
        <p>Aski Haski</p>
    </footer>
    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
