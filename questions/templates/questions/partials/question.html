{% load static %}

<article>
    <div class="question-content">
        <img
            src="{% static question.avatar %}"
            alt="Аватар автора"
        >

        <div class="question-text">
            <h2>
                <a href="{% url 'questions:question' question_id=question.id %}">
                    {{ question.title }}
                </a>
            </h2>

            <p>{{ question.text }}</p>

            <div class="question-meta">
                <time>{{ question.created_at }}</time>
                <a href="{% url 'questions:question' question_id=question.id %}">
                    Ответы: {{ question.answers_count }}
                </a>
            </div>

            <p>
                Теги:
                {% for tag in question.tags %}
                    <a href="{% url 'questions:tag' tag=tag.slug %}">
                        {{ tag.name }}
                    </a>
                {% endfor %}
            </p>
        </div>
    </div>

    <div class="votes">
        <span class="vote-count">{{ question.rating }}</span>
        <button
            type="button"
            class="vote-button{% if question.vote_state == 'liked' %} liked{% endif %}"
        >
            +
        </button>
        <button
            type="button"
            class="vote-button{% if question.vote_state == 'disliked' %} disliked{% endif %}"
        >
            -
        </button>
    </div>
</article>
