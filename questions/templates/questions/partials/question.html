{% load static %}

<article>
    <div class="question-content">
        <img
            src="{% static question.author.profile.avatar %}"
            alt="Аватар автора"
        >

        <div class="question-text">
            <h2>
                <a href="{{ question.get_absolute_url }}">
                    {{ question.title }}
                </a>
            </h2>

            <p>{{ question.text }}</p>
            <p>Автор: {{ question.author.username }}</p>

            <div class="question-meta">
                <time>{{ question.created_at|date:"d.m.Y H:i" }}</time>
                <a href="{{ question.get_absolute_url }}">
                    Ответы: {{ question.answers_count }}
                </a>
            </div>

            <p>
                Теги:
                {% for tag in question.tags.all %}
                    <a href="{% url 'questions:tag' tag=tag.slug %}">
                        {{ tag.name }}
                    </a>
                {% endfor %}
            </p>
        </div>
    </div>

    <div class="votes">
        <span class="vote-count">{{ question.rating }}</span>
        <button
            type="button"
            class="vote-button"
        >
            +
        </button>
        <button
            type="button"
            class="vote-button"
        >
            -
        </button>
    </div>
</article>
