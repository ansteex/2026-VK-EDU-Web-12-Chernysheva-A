{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Aski Haski
        {% endblock %}
    </title>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'img/avatar6.png' %}"
    >
    <link
        rel="stylesheet"
        href="{% static 'css/bootstrap.min.css' %}"
    >
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>
<body>
    {% include "includes/header.html" %}

    <main>
        {% block content %}
        {% endblock %}

        {% include "includes/sidebar.html" %}
    </main>

    <footer class="footer">
        <p>Aski Haski</p>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
